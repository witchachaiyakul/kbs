<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กำลังเข้าสู่ระบบ LINE...</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { font-family: sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; background:#f3f4f6; color:#374151; margin:0; }
  .box { text-align:center; padding:24px; }
  .spin { width:40px; height:40px; border:4px solid #d1fae5; border-top-color:#06c755; border-radius:50%; margin:0 auto 16px; animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box"><div class="spin"></div><p id="msg">กำลังเข้าสู่ระบบ LINE...</p></div>
<script>
  const LIFF_ID = "2012279186-NxQVJ4Ni";

  liff.init({ liffId: LIFF_ID }).then(() => {
    if (!liff.isLoggedIn()) { liff.login(); return; }   // อยู่หน้าต่างบนสุด จึงเปิดหน้า Login ของ LINE ได้
    const idToken = liff.getIDToken();
    if (!idToken) throw new Error("ไม่ได้รับ ID Token (ตรวจ scope openid ใน LIFF)");
    const params = new URLSearchParams(location.search);
    const page = params.get('page');
    const targetPage = page === 'admin_dashboard' ? 'admin.html' : 'index.html';
    const returnTo = params.get('returnTo');
    let target = new URL(targetPage, location.href);

    if (returnTo) {
      try {
        const localTarget = new URL(returnTo);
        if (localTarget.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(localTarget.hostname)) {
          target = new URL(targetPage, localTarget);
        }
      } catch (e) {}
    }

    target.searchParams.set('idt', idToken);
    if (page && page !== 'admin_dashboard') target.searchParams.set('page', page);
    location.replace(target.toString());
  }).catch(err => {
    console.error(err);
    document.getElementById('msg').textContent = "เข้าสู่ระบบไม่สำเร็จ: " + err.message;
  });
</script>
</body>
</html>
