<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปข้อมูลการลา (ผู้บริหาร)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="p-4 md:p-6">

    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-xl shadow-sm p-5 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-chart-pie text-indigo-600"></i> สรุปข้อมูลการลา</h1>
                <p class="text-sm text-gray-500">โรงเรียนกาญจนาภิเษกวิทยาลัย กระบี่</p>
            </div>
            <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-lg">
                <i class="fa-regular fa-calendar text-gray-500"></i>
                <input type="date" id="filterDate" class="bg-transparent border-none outline-none text-gray-700 font-medium cursor-pointer" onchange="loadData()">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500 text-center">
                <div class="text-gray-500 text-xs mb-1">ลาทั้งหมด</div>
                <div class="text-2xl font-bold text-gray-800" id="countTotal">0</div>
                <div class="text-xs text-gray-400">คน</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-yellow-500 text-center">
                <div class="text-gray-500 text-xs mb-1">รออนุมัติ</div>
                <div class="text-2xl font-bold text-yellow-600" id="countPending">0</div>
                <div class="text-xs text-gray-400">คน</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500 text-center">
                <div class="text-gray-500 text-xs mb-1">อนุมัติแล้ว</div>
                <div class="text-2xl font-bold text-green-600" id="countApproved">0</div>
                <div class="text-xs text-gray-400">คน</div>
            </div>
        </div>

        <div id="loading" class="text-center py-10 text-gray-500">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i><br>กำลังประมวลผลข้อมูล...
        </div>

        <div id="resultList" class="space-y-3 hidden">
            </div>
        
        <div id="noData" class="hidden text-center py-10 bg-white rounded-xl shadow-sm">
            <div class="text-4xl mb-2">🍃</div>
            <p class="text-gray-500">ไม่มีรายการลาในวันนี้</p>
        </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/admin.js"></script>
</body>
</html>
