<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการสิทธิ์และรายชื่อ Dropdown - KBS</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #1f2937; }
    .container { max-width: 1000px; margin: 30px auto; padding: 0 16px; }
    .header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      background: #fff; padding: 20px 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .header h1 { margin: 0; font-size: 1.4rem; color: #111827; }
    .header p { margin: 4px 0 0; font-size: 0.9rem; color: #6b7280; }
    .btn-back {
      background: #e5e7eb; color: #374151; border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .btn-back:hover { background: #d1d5db; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 240px; padding: 10px 14px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 0.95rem;
    }
    .card {
      background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; }
    th { background: #f9fafb; font-weight: 700; color: #374151; font-size: 0.9rem; }
    td.center, th.center { text-align: center; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
    }
    .badge-done { background: #d1fae5; color: #065f46; }
    .badge-wait { background: #fef3c7; color: #92400e; }
    .badge-admin { background: #dbeafe; color: #1e40af; }
    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1; transition: .25s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .25s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(22px); }
    input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }
    #toast {
      position: fixed; bottom: 20px; right: 20px; background: #111827; color: #fff;
      padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; opacity: 0;
      transition: opacity 0.3s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>⚙️ จัดการรายชื่อ Dropdown บุคลากร</h1>
        <p>กำหนดรายชื่อที่จะแสดงในตัวเลือกของระบบงานทั่วไป (General) และระบบการเงิน (Pay)</p>
      </div>
      <a href="index.html" class="btn-back">← กลับหน้าหลัก</a>
    </div>

    <div class="toolbar">
      <input type="text" id="search-input" class="search-box" placeholder="🔍 ค้นหาชื่อ หรือตำแหน่ง..." />
      <span id="total-count" style="color: #6b7280; font-size: 0.9rem;">กำลังโหลดข้อมูล...</span>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width: 60px;">#</th>
            <th>ชื่อ - นามสกุล</th>
            <th>ตำแหน่ง</th>
            <th class="center">สถานะ LINE</th>
            <th class="center">General Dropdown<br><small style="font-weight:400; color:#6b7280;">(general_dropdown)</small></th>
            <th class="center">Pay Dropdown<br><small style="font-weight:400; color:#6b7280;">(pay_dropdown)</small></th>
          </tr>
        </thead>
        <tbody id="committees-tbody">
          <tr><td colspan="6" class="center" style="padding: 30px;">กำลังโหลดรายชื่อบุคลากร...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast">บันทึกสำเร็จ</div>
  <script type="module" src="js/role.js"></script>
</body>
</html>
